name: CI

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./ci/run
